<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentacion</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        #slide-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* PDF slides */
        .slide {
            display: none;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
        }

        .slide.active {
            display: flex;
        }

        .slide canvas {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }

        /* Video slide */
        #video-slide {
            display: none;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #video-slide.active {
            display: flex;
        }

        #video-slide video {
            max-width: 100vw;
            max-height: 100vh;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Link slide */
        #link-slide {
            display: none;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #link-slide.active {
            display: flex;
        }

        #link-slide iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #link-slide .link-fallback {
            text-align: center;
        }

        #link-slide .link-fallback a {
            color: #4fc3f7;
            font-size: 2rem;
            text-decoration: none;
            border: 2px solid #4fc3f7;
            padding: 20px 40px;
            border-radius: 12px;
            transition: all 0.3s;
        }

        #link-slide .link-fallback a:hover {
            background: #4fc3f7;
            color: #000;
        }

        /* Navigation indicator */
        #nav-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        #nav-indicator.visible {
            opacity: 1;
        }

        /* Section labels */
        #section-label {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #section-label.visible {
            opacity: 1;
        }

        /* Loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #loading .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #4fc3f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        #loading p {
            margin-top: 20px;
            font-size: 16px;
            color: #aaa;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Progress bar */
        #progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 3px;
            background: #4fc3f7;
            transition: width 0.3s;
            z-index: 100;
        }

        /* Fullscreen button */
        #fullscreen-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 200;
            font-size: 22px;
            opacity: 1;
            transition: background 0.3s;
        }

        #fullscreen-btn:hover {
            background: rgba(79, 195, 247, 0.5);
        }

        /* Arrow hints */
        .arrow-hint {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            color: rgba(255,255,255,0.15);
            z-index: 50;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .arrow-hint.left { left: 15px; }
        .arrow-hint.right { right: 15px; }

        #slide-container:hover ~ .arrow-hint {
            color: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <p>Cargando presentacion...</p>
    </div>

    <div id="slide-container"></div>

    <div id="nav-indicator"></div>
    <div id="section-label"></div>
    <div id="progress-bar"></div>
    <button id="fullscreen-btn" title="Pantalla completa (F)">&#x26F6;</button>
    <div class="arrow-hint left">&#10094;</div>
    <div class="arrow-hint right">&#10095;</div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const PDF_FILE = 'Green and White Clean Typographic Agriculture Presentation (1).pdf';
        const VIDEO_FILE = 'ONE-UNINTERRUPTED-4-SECOND-ultra-photore.mp4';
        const EXTERNAL_LINK = 'https://beliefs-meter-bristol-markets.trycloudflare.com/viewer/?ws=wss://based-canal-simplified-donated.trycloudflare.com/ws/viewer';

        const container = document.getElementById('slide-container');
        const navIndicator = document.getElementById('nav-indicator');
        const sectionLabel = document.getElementById('section-label');
        const progressBar = document.getElementById('progress-bar');
        const loading = document.getElementById('loading');

        let slides = [];
        let currentSlide = 0;
        let hideTimeout;
        let sectionTimeout;

        // Sections info for labels
        const sections = [];

        async function loadPDF() {
            const pdf = await pdfjsLib.getDocument(PDF_FILE).promise;
            const numPages = pdf.numPages;
            const pdfSlides = [];

            for (let i = 1; i <= numPages; i++) {
                const page = await pdf.getPage(i);
                // Use high scale for maximum resolution
                const scale = 3;
                const viewport = page.getViewport({ scale });

                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                const ctx = canvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport }).promise;

                const slideDiv = document.createElement('div');
                slideDiv.className = 'slide';
                slideDiv.setAttribute('data-section', 'Presentacion PDF');
                slideDiv.appendChild(canvas);
                pdfSlides.push(slideDiv);

                // Update loading progress
                loading.querySelector('p').textContent = `Cargando pagina ${i} de ${numPages}...`;
            }

            // Secuencia: paginas 1 a 6, video, enlace y paginas restantes.
            pdfSlides.slice(0, 6).forEach((slide) => {
                container.appendChild(slide);
                slides.push(slide);
            });

            createVideoSlide();
            createLinkSlide();

            pdfSlides.slice(6).forEach((slide) => {
                container.appendChild(slide);
                slides.push(slide);
            });
        }

        function createVideoSlide() {
            const slideDiv = document.createElement('div');
            slideDiv.id = 'video-slide';
            slideDiv.setAttribute('data-section', 'Video');

            const video = document.createElement('video');
            video.src = VIDEO_FILE;
            video.controls = true;
            video.playsInline = true;
            video.preload = 'auto';

            slideDiv.appendChild(video);
            container.appendChild(slideDiv);
            slides.push(slideDiv);
        }

        function createLinkSlide() {
            if (!EXTERNAL_LINK) return;

            const slideDiv = document.createElement('div');
            slideDiv.id = 'link-slide';
            slideDiv.setAttribute('data-section', 'Link Externo');

            const iframe = document.createElement('iframe');
            iframe.src = EXTERNAL_LINK;
            iframe.title = 'Viewer externo';
            iframe.allow = 'fullscreen';
            slideDiv.appendChild(iframe);

            container.appendChild(slideDiv);
            slides.push(slideDiv);
        }

        function showSlide(index) {
            if (index < 0 || index >= slides.length) return;

            // Pause video if leaving video slide
            const currentEl = slides[currentSlide];
            const vid = currentEl.querySelector('video');
            if (vid) vid.pause();

            // Update classes
            slides[currentSlide].classList.remove('active');
            currentSlide = index;
            slides[currentSlide].classList.add('active');

            // Auto-play video when entering video slide
            const newVid = slides[currentSlide].querySelector('video');
            if (newVid) newVid.play();

            // Update progress bar
            const pct = ((currentSlide + 1) / slides.length) * 100;
            progressBar.style.width = pct + '%';

            // Show nav indicator
            showNav();
            showSection();
        }

        function showNav() {
            navIndicator.textContent = `${currentSlide + 1} / ${slides.length}`;
            navIndicator.classList.add('visible');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => navIndicator.classList.remove('visible'), 2000);
        }

        function showSection() {
            const sec = slides[currentSlide].getAttribute('data-section');
            if (sec) {
                sectionLabel.textContent = sec;
                sectionLabel.classList.add('visible');
                clearTimeout(sectionTimeout);
                sectionTimeout = setTimeout(() => sectionLabel.classList.remove('visible'), 2000);
            }
        }

        function nextSlide() { showSlide(currentSlide + 1); }
        function prevSlide() { showSlide(currentSlide - 1); }

        function toggleFullscreen() {
            const el = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                if (el.requestFullscreen) {
                    el.requestFullscreen();
                } else if (el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                } else if (el.msRequestFullscreen) {
                    el.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowRight':
                case 'ArrowDown':
                case ' ':
                    e.preventDefault();
                    nextSlide();
                    break;
                case 'ArrowLeft':
                case 'ArrowUp':
                    e.preventDefault();
                    prevSlide();
                    break;
                case 'Home':
                    e.preventDefault();
                    showSlide(0);
                    break;
                case 'End':
                    e.preventDefault();
                    showSlide(slides.length - 1);
                    break;
                case 'f':
                case 'F':
                    // Don't trigger fullscreen if typing in an input
                    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                        toggleFullscreen();
                    }
                    break;
                case 'Escape':
                    // handled by browser for fullscreen
                    break;
            }
        });

        // Click/touch navigation
        container.addEventListener('click', (e) => {
            // Don't navigate if clicking video controls
            if (e.target.tagName === 'VIDEO') return;
            const x = e.clientX;
            if (x > window.innerWidth / 2) {
                nextSlide();
            } else {
                prevSlide();
            }
        });

        // Touch swipe
        let touchStartX = 0;
        container.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });
        container.addEventListener('touchend', (e) => {
            const diff = touchStartX - e.changedTouches[0].screenX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextSlide();
                else prevSlide();
            }
        });

        // Fullscreen button
        document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);

        // Init
        async function init() {
            try {
                await loadPDF();

                if (slides.length > 0) {
                    slides[0].classList.add('active');
                    showNav();
                    showSection();
                }

                loading.style.display = 'none';
            } catch (err) {
                loading.querySelector('p').textContent = 'Error al cargar: ' + err.message;
                console.error(err);
            }
        }

        init();
    </script>
</body>
</html>
