<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#13251b">
    <title>Transmitir cámara | HackCórdoba</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/camera.js?v=2" defer></script>
  </head>
  <body>
    <main class="app-shell camera-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Dispositivo emisor</p>
          <h1>Transmitir cámara</h1>
        </div>
        <a class="text-link" href="/">Inicio</a>
      </header>

      <section class="status-strip" aria-live="polite">
        <span id="connectionDot" class="status-dot neutral"></span>
        <strong id="connectionStatus">Sin iniciar</strong>
        <span id="secureStatus" class="status-detail"></span>
      </section>

      <section class="video-stage camera-stage">
        <video id="cameraPreview" autoplay muted playsinline></video>
        <div id="cameraPlaceholder" class="stage-placeholder">
          <span class="placeholder-icon">●</span>
          <p>Presione “Iniciar transmisión” y permita el acceso a la cámara.</p>
        </div>
        <canvas id="captureCanvas" hidden></canvas>
      </section>

      <section class="stats-grid" aria-label="Estadísticas de transmisión">
        <div class="stat-card"><span>FPS enviados</span><strong id="sentFps">0.0</strong></div>
        <div class="stat-card"><span>Frames</span><strong id="sentFrames">0</strong></div>
        <div class="stat-card"><span>Resolución</span><strong id="frameResolution">—</strong></div>
        <div class="stat-card"><span>En espera</span><strong id="bufferedBytes">0 KB</strong></div>
      </section>

      <section class="control-panel">
        <div class="control-row">
          <label for="fpsSetting">FPS objetivo</label>
          <select id="fpsSetting">
            <option value="5">5 FPS</option>
            <option value="8">8 FPS</option>
            <option value="10">10 FPS</option>
            <option value="12" selected>12 FPS</option>
            <option value="15">15 FPS</option>
          </select>
        </div>
        <div class="control-row">
          <label for="widthSetting">Ancho máximo</label>
          <select id="widthSetting">
            <option value="480">480 px</option>
            <option value="640" selected>640 px</option>
            <option value="960">960 px</option>
          </select>
        </div>
        <div class="control-row quality-row">
          <label for="qualitySetting">Calidad JPEG <span id="qualityValue">60 %</span></label>
          <input id="qualitySetting" type="range" min="40" max="90" value="60" step="5">
        </div>
      </section>

      <p id="errorMessage" class="message error-message" role="alert" hidden></p>

      <div class="button-row sticky-actions">
        <button id="startButton" class="button primary" type="button">Iniciar transmisión</button>
        <button id="stopButton" class="button secondary" type="button" disabled>Detener</button>
      </div>
    </main>
  </body>
</html>
